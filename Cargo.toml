[package]
name = "attacca-cli"
version = "0.2.0"
edition = "2021"
description = "Attacca CLI — dual-computer bridge"

[[bin]]
name = "attacca"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
zyris = { git = "https://github.com/attacca-cc/zyris", version = "0.1.0", features = ["enroll"] }
zyris-attacca = { git = "https://github.com/attacca-cc/zyris", version = "0.1.0" }
zyris-caps = { git = "https://github.com/attacca-cc/zyris", version = "0.1.0" }
futures-util = "0.3.33"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"

[dev-dependencies]
futures-util = "0.3.33"
zyris = { git = "https://github.com/attacca-cc/zyris", features = ["testing"] }
