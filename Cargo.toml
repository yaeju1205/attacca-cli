[package]
name = "attacca-cli"
version = "0.1.0"
edition = "2021"
description = "A Claude Code-style CLI for Attacca API"

[[bin]]
name = "attacca"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
ratatui = "0.28"
crossterm = "0.28"
