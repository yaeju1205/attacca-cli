[package]
name = "attacca-cli"
version = "0.2.0"
edition = "2021"
description = "Attacca CLI — dual-computer bridge"

[[bin]]
name = "attacca"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
unicode-width = "0.1"
